services:
  moodle:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_URL_MOODLE_80: /
      MOODLE_URL: https://legado.theloopcode.com
      DB_HOST: db
      DB_NAME: moodle
      DB_USER: moodle
      DB_PASSWORD: ${SERVICE_PASSWORD_MOODLE}
      MOODLE_ADMIN_USER: ${MOODLE_ADMIN_USER:-admin}
      MOODLE_ADMIN_PASSWORD: ${SERVICE_PASSWORD_MOODLEADMIN}
      MOODLE_ADMIN_EMAIL: ${MOODLE_ADMIN_EMAIL:?Set an admin email in Coolify}
      MOODLE_SITE_NAME: ${MOODLE_SITE_NAME:-Moodle}
      MOODLE_SITE_SHORTNAME: ${MOODLE_SITE_SHORTNAME:-moodle}
    volumes:
      - moodledata:/var/moodledata
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "80"

  cron:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MOODLE_ROLE: cron
      MOODLE_URL: https://legado.theloopcode.com
      DB_HOST: db
      DB_NAME: moodle
      DB_USER: moodle
      DB_PASSWORD: ${SERVICE_PASSWORD_MOODLE}
    volumes:
      - moodledata:/var/moodledata
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.6
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: moodle
      MARIADB_USER: moodle
      MARIADB_PASSWORD: ${SERVICE_PASSWORD_MOODLE}
      MARIADB_ROOT_PASSWORD: ${SERVICE_PASSWORD_MOODLEROOT}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  moodledata:
  dbdata:
